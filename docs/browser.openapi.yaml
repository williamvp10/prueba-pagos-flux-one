---
openapi: 3.0.3
info:
  title: Flux One browser BFF API
  version: 1.1.0
  description: Contrato browser → Next.js BFF. Cookies HttpOnly; no tokens en responses.
    Derivado del contrato de servicios, con adaptación auth y servidores del mismo
    origen. Toda mutación valida Origin contra APP_ORIGIN. Core v1 implementado;
    links de cobro v1.1 especificados y pendientes de implementación.
  license:
    name: UNLICENSED
servers:
- url: http://localhost:3000/api/v1
  description: BFF del mismo origen; sustituir origen por dominio HTTPS en Dokploy
tags:
- name: Auth
  description: Auth service
- name: Payments
  description: Payments service
- name: Audit
  description: Audit service
security:
- accessCookie: []
paths:
  "/auth/register":
    post:
      operationId: register
      tags:
      - Auth
      summary: Registrar usuario
      description: Registrar usuario
      responses:
        '201':
          description: Identidad creada; iniciar sesión y ejecutar bootstrap de cuenta
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '409':
          "$ref": "#/components/responses/409"
        '422':
          "$ref": "#/components/responses/422"
        '429':
          "$ref": "#/components/responses/429"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
        '400':
          "$ref": "#/components/responses/400"
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Credentials"
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        description: Header gestionado por navegador, debe coincidir con APP_ORIGIN;
          no configurarlo desde JavaScript.
        schema:
          type: string
          format: uri
  "/auth/login":
    post:
      operationId: login
      tags:
      - Auth
      summary: Abrir sesión
      description: Valida credenciales en auth, guarda tokens en cookies HttpOnly
        y devuelve solo usuario/expiración. Bootstrap de cuenta es POST separado tras
        sesión.
      responses:
        '200':
          description: Sesión establecida/renovada; Set-Cookie HttpOnly, sin tokens
            en body
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BrowserSession"
        '401':
          "$ref": "#/components/responses/401"
        '422':
          "$ref": "#/components/responses/422"
        '429':
          "$ref": "#/components/responses/429"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
        '400':
          "$ref": "#/components/responses/400"
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Credentials"
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        description: Header gestionado por navegador, debe coincidir con APP_ORIGIN;
          no configurarlo desde JavaScript.
        schema:
          type: string
          format: uri
  "/auth/refresh":
    post:
      operationId: refresh
      tags:
      - Auth
      summary: Rotar refresh y emitir access token
      description: Lee refresh desde cookie HttpOnly; rota sesión y actualiza cookies.
        Browser coordina un refresh en vuelo.
      responses:
        '200':
          description: Sesión establecida/renovada; Set-Cookie HttpOnly, sin tokens
            en body
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BrowserSession"
        '401':
          "$ref": "#/components/responses/401"
        '422':
          "$ref": "#/components/responses/422"
        '429':
          "$ref": "#/components/responses/429"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
        '400':
          "$ref": "#/components/responses/400"
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
      - refreshCookie: []
      parameters:
      - name: Origin
        in: header
        required: true
        description: Header gestionado por navegador, debe coincidir con APP_ORIGIN;
          no configurarlo desde JavaScript.
        schema:
          type: string
          format: uri
  "/auth/logout":
    post:
      operationId: logout
      tags:
      - Auth
      summary: Revocar familia de sesión
      description: Revoca refresh si existe y elimina cookies; idempotente incluso
        sin cookies. Valida Origin.
      responses:
        '204':
          description: Logout idempotente incluso si refresh ya está revocado
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
        '400':
          "$ref": "#/components/responses/400"
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
      parameters:
      - name: Origin
        in: header
        required: true
        description: Header gestionado por navegador, debe coincidir con APP_ORIGIN;
          no configurarlo desde JavaScript.
        schema:
          type: string
          format: uri
  "/auth/me":
    get:
      operationId: getCurrentUser
      tags:
      - Auth
      summary: Consultar identidad
      description: Consultar identidad
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/accounts/bootstrap":
    post:
      operationId: bootstrapAccount
      tags:
      - Payments
      summary: Provisionar cuenta del usuario autenticado
      description: Sin body ni Idempotency-Key; unicidad por propietario/tipo garantiza
        una cuenta principal. Cada usuario demo conserva su cuenta seed. No crea saldo
        inicial.
      responses:
        '201':
          description: Cuenta en cero creada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '200':
          description: Cuenta principal ya existente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Account"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: Origin
        in: header
        required: true
        description: Header gestionado por navegador, debe coincidir con APP_ORIGIN;
          no configurarlo desde JavaScript.
        schema:
          type: string
          format: uri
  "/accounts":
    get:
      operationId: listAccounts
      tags:
      - Payments
      summary: Listar cuentas propias
      description: Listar cuentas propias
      responses:
        '200':
          description: Sin efectos secundarios; lista vacía si falta bootstrap
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Account"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/beneficiaries":
    get:
      operationId: listBeneficiaries
      tags:
      - Payments
      summary: Listar destinos internos y externos válidos
      description: Listar destinos internos y externos válidos
      responses:
        '200':
          description: Códigos y etiquetas públicas; sin propietarios, emails ni saldos
            ajenos
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Beneficiary"
        '401':
          "$ref": "#/components/responses/401"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/payment-links":
    post:
      operationId: createPaymentLink
      tags:
      - Payments
      summary: Crear link de cobro de un solo uso
      description: El destino debe pertenecer a la sesión. No reserva ni mueve dinero. Vence exactamente 24 horas después de createdAt.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePaymentLink"
      responses:
        '201':
          description: Link ACTIVE creado
          headers:
            Idempotency-Replayed:
              description: true cuando se devuelve el resultado guardado
              schema:
                type: boolean
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentLink"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
    get:
      operationId: listPaymentLinks
      tags:
      - Payments
      summary: Listar links creados por la sesión
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
      - name: status
        in: query
        schema:
          "$ref": "#/components/schemas/PaymentLinkStatus"
      responses:
        '200':
          description: Página de links propios
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentLinkPage"
        '401':
          "$ref": "#/components/responses/401"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/payment-links/resolve":
    post:
      operationId: resolvePaymentLink
      tags:
      - Payments
      summary: Resolver invitación activa
      description: Requiere sesión cookie; solo devuelve resumen mínimo. Token inválido o link no ACTIVE responde 404. Cache-Control private, no-store.
      parameters:
      - "$ref": "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResolvePaymentLink"
      responses:
        '200':
          description: Resumen mínimo del cobro activo
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentLinkCheckout"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/payment-links/pay":
    post:
      operationId: payPaymentLink
      tags:
      - Payments
      summary: Pagar link con una cuenta propia
      description: Pago interno, atómico y de un solo uso. El BFF conserva body e Idempotency-Key y nunca persiste el token.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PayPaymentLink"
      responses:
        '201':
          description: Link pagado y transferencia interna COMPLETED
          headers:
            Idempotency-Replayed:
              description: true cuando se devuelve el resultado guardado
              schema:
                type: boolean
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentLinkPayment"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/payment-links/{paymentLinkId}":
    get:
      operationId: getPaymentLink
      tags:
      - Payments
      summary: Consultar link como participante
      parameters:
      - "$ref": "#/components/parameters/PaymentLinkId"
      responses:
        '200':
          description: Estado vivo del link
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentLink"
        '401':
          "$ref": "#/components/responses/401"
        '404':
          "$ref": "#/components/responses/404"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/payment-links/{paymentLinkId}/share-token":
    get:
      operationId: getPaymentLinkShareToken
      tags:
      - Payments
      summary: Obtener token compartible
      description: Solo creador de link ACTIVE. Cache-Control private, no-store; el browser construye APP_ORIGIN/pay#token.
      parameters:
      - "$ref": "#/components/parameters/PaymentLinkId"
      responses:
        '200':
          description: Token firmado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentLinkShareToken"
        '401':
          "$ref": "#/components/responses/401"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/payment-links/{paymentLinkId}/cancel":
    post:
      operationId: cancelPaymentLink
      tags:
      - Payments
      summary: Cancelar link activo
      parameters:
      - "$ref": "#/components/parameters/PaymentLinkId"
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/Origin"
      responses:
        '200':
          description: Link CANCELLED o replay
          headers:
            Idempotency-Replayed:
              description: true cuando se devuelve el resultado guardado
              schema:
                type: boolean
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PaymentLink"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
  "/transfers":
    post:
      operationId: createTransfer
      tags:
      - Payments
      summary: Crear transferencia
      description: Replay conserva status/body originales. Idempotencia por subject
        + CREATE_TRANSFER + key. Decisiones de negocio definitivas consumen key. Validación/JWT
        no. Consultar GET para estado actual.
      responses:
        '201':
          description: Interna completada atómicamente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transfer"
          headers:
            Idempotency-Replayed:
              description: true cuando se devuelve el resultado guardado
              schema:
                type: boolean
        '202':
          description: Externa persistida y reservada; resultado bancario pendiente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transfer"
          headers:
            Idempotency-Replayed:
              description: true cuando se devuelve el resultado guardado
              schema:
                type: boolean
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateTransfer"
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - name: Origin
        in: header
        required: true
        description: Header gestionado por navegador, debe coincidir con APP_ORIGIN;
          no configurarlo desde JavaScript.
        schema:
          type: string
          format: uri
    get:
      operationId: listTransfers
      tags:
      - Payments
      summary: Historial propio como origen o destinatario interno
      description: Historial propio como origen o destinatario interno
      responses:
        '200':
          description: Orden createdAt DESC, id DESC; cursor opaco vinculado a filtros
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransferPage"
        '401':
          "$ref": "#/components/responses/401"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - UNKNOWN
          - COMPLETED
          - FAILED
          - REVERSED
  "/transfers/{transferId}":
    get:
      operationId: getTransfer
      tags:
      - Payments
      summary: Consultar estado actual y último reverso
      description: Consultar estado actual y último reverso
      responses:
        '200':
          description: Recurso visible para participante autorizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transfer"
        '401':
          "$ref": "#/components/responses/401"
        '404':
          "$ref": "#/components/responses/404"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      parameters:
      - name: transferId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  "/transfers/{transferId}/reversals":
    post:
      operationId: reverseTransfer
      tags:
      - Payments
      summary: Solicitar reverso total
      description: 'Sin body: el monto se deriva de la transferencia original. Solo
        propietario del origen. Namespace CREATE_REVERSAL; transferId forma parte
        del hash. Un máximo de un reverso activo/exitoso. Reintentar un reverso rechazado
        requiere nueva key.'
      responses:
        '201':
          description: Interno completado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reversal"
          headers:
            Idempotency-Replayed:
              description: true cuando se devuelve el resultado guardado
              schema:
                type: boolean
        '202':
          description: Externo pendiente de confirmación
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Reversal"
          headers:
            Idempotency-Replayed:
              description: true cuando se devuelve el resultado guardado
              schema:
                type: boolean
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
        '403':
          description: ORIGIN_NOT_ALLOWED
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - name: transferId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - "$ref": "#/components/parameters/IdempotencyKey"
      - name: Origin
        in: header
        required: true
        description: Header gestionado por navegador, debe coincidir con APP_ORIGIN;
          no configurarlo desde JavaScript.
        schema:
          type: string
          format: uri
  "/transfers/{transferId}/audit":
    get:
      operationId: getTransferAudit
      tags:
      - Audit
      summary: Consultar auditoría autorizada de una transferencia
      description: Audit comprueba permiso con GET de payments y JWT original antes
        de leer su esquema. Si payments falla, devuelve 503; ajeno devuelve 404.
      responses:
        '200':
          description: Puede estar vacío mientras llegan eventos. Orden sequence ASC;
            cursor de secuencia.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuditPage"
        '401':
          "$ref": "#/components/responses/401"
        '404':
          "$ref": "#/components/responses/404"
        '422':
          "$ref": "#/components/responses/422"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      parameters:
      - name: transferId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: fluxone_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: fluxone_refresh
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Una key por intención durable (financiera o ciclo de link). Persistir
        en reintentos; UUID recomendado.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._:-]{1,128}$"
        example: 7b149aee-0b55-4d4d-9a03-0762c9758b38
    PaymentLinkId:
      name: paymentLinkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Origin:
      name: Origin
      in: header
      required: true
      description: Header gestionado por navegador, debe coincidir con APP_ORIGIN; no configurarlo desde JavaScript.
      schema:
        type: string
        format: uri
  responses:
    '400':
      description: Header o request inválido
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '401':
      description: Sesión/token inválido
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '403':
      description: Origen de mutación no permitido por el BFF
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '404':
      description: Recurso inexistente o sin permiso
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '409':
      description: Conflicto de negocio o idempotencia
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '422':
      description: Validación de datos
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '429':
      description: Rate limit
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar
          schema:
            type: integer
            minimum: 1
    '500':
      description: Error interno no confirmado; repetir con la misma key
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '503':
      description: Dependencia indisponible; repetir con la misma key
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar
          schema:
            type: integer
            minimum: 1
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          example: INSUFFICIENT_FUNDS
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Credentials:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
    Account:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - currency
      - balance
      - reserved
      - available
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 3
          maxLength: 64
          example: ACC-002
        currency:
          type: string
          enum:
          - COP
        balance:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$"
          example: '1000000.00'
        reserved:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$"
          example: '1000000.00'
        available:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$"
          example: '1000000.00'
    Beneficiary:
      type: object
      additionalProperties: false
      required:
      - kind
      - code
      - label
      properties:
        kind:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
        code:
          type: string
          minLength: 3
          maxLength: 64
          example: ACC-002
        label:
          type: string
    PaymentLinkStatus:
      type: string
      enum:
      - ACTIVE
      - PAID
      - CANCELLED
      - EXPIRED
    CreatePaymentLink:
      type: object
      additionalProperties: false
      required:
      - destinationAccountId
      - amount
      - currency
      properties:
        destinationAccountId:
          type: string
          format: uuid
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,2})?$"
          example: '1250.25'
        currency:
          type: string
          enum:
          - COP
    PaymentLinkDestination:
      type: object
      additionalProperties: false
      required:
      - accountId
      - code
      - label
      properties:
        accountId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 3
          maxLength: 64
          example: ACC-001
        label:
          type: string
    PaymentLinkCheckoutDestination:
      type: object
      additionalProperties: false
      required:
      - code
      - label
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 64
          example: ACC-001
        label:
          type: string
    PaymentLink:
      type: object
      additionalProperties: false
      required:
      - id
      - destination
      - amount
      - currency
      - status
      - expiresAt
      - paidTransferId
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        destination:
          "$ref": "#/components/schemas/PaymentLinkDestination"
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$"
          example: '1250.25'
        currency:
          type: string
          enum:
          - COP
        status:
          "$ref": "#/components/schemas/PaymentLinkStatus"
        expiresAt:
          type: string
          format: date-time
        paidTransferId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PaymentLinkPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/PaymentLink"
        nextCursor:
          type: string
          nullable: true
    PaymentLinkShareToken:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 84
          maxLength: 84
          pattern: "^pl1\\.[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\\.[A-Za-z0-9_-]{43}$"
    ResolvePaymentLink:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
    PaymentLinkCheckout:
      type: object
      additionalProperties: false
      required:
      - linkId
      - destination
      - amount
      - currency
      - expiresAt
      properties:
        linkId:
          type: string
          format: uuid
        destination:
          "$ref": "#/components/schemas/PaymentLinkCheckoutDestination"
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$"
          example: '1250.25'
        currency:
          type: string
          enum:
          - COP
        expiresAt:
          type: string
          format: date-time
    PayPaymentLink:
      type: object
      additionalProperties: false
      required:
      - token
      - sourceAccountId
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
        sourceAccountId:
          type: string
          format: uuid
    PaymentLinkPayment:
      type: object
      additionalProperties: false
      required:
      - paymentLink
      - transfer
      properties:
        paymentLink:
          "$ref": "#/components/schemas/PaymentLink"
        transfer:
          "$ref": "#/components/schemas/Transfer"
    CreateTransfer:
      type: object
      additionalProperties: false
      required:
      - sourceAccountId
      - destination
      - amount
      - currency
      properties:
        sourceAccountId:
          type: string
          format: uuid
        destination:
          type: object
          additionalProperties: false
          required:
          - kind
          - code
          properties:
            kind:
              type: string
              enum:
              - INTERNAL
              - EXTERNAL
            code:
              type: string
              minLength: 3
              maxLength: 64
              example: ACC-002
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})(\\.[0-9]{1,2})?$"
          example: '1250.25'
          description: COP positivo, máximo 999999999999.99. Normalizar a dos decimales;
            dominio valida > 0.
        currency:
          type: string
          enum:
          - COP
    Reversal:
      type: object
      additionalProperties: false
      required:
      - id
      - transferId
      - status
      - amount
      - failureCode
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        transferId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - UNKNOWN
          - COMPLETED
          - FAILED
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$"
          example: '1000000.00'
        failureCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Transfer:
      type: object
      additionalProperties: false
      required:
      - id
      - sourceAccountId
      - origin
      - paymentLinkId
      - destination
      - amount
      - currency
      - status
      - failureCode
      - reversal
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        origin:
          type: string
          enum:
          - DIRECT
          - PAYMENT_LINK
        paymentLinkId:
          type: string
          format: uuid
          nullable: true
        destination:
          "$ref": "#/components/schemas/Beneficiary"
        amount:
          type: string
          pattern: "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$"
          example: '1000000.00'
        currency:
          type: string
          enum:
          - COP
        status:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - UNKNOWN
          - COMPLETED
          - FAILED
          - REVERSED
        failureCode:
          type: string
          nullable: true
        reversal:
          type: object
          additionalProperties: false
          required:
          - id
          - transferId
          - status
          - amount
          - failureCode
          - createdAt
          - updatedAt
          properties:
            id:
              type: string
              format: uuid
            transferId:
              type: string
              format: uuid
            status:
              type: string
              enum:
              - PENDING
              - PROCESSING
              - UNKNOWN
              - COMPLETED
              - FAILED
            amount:
              type: string
              pattern: "^(0|[1-9][0-9]{0,11})\\.[0-9]{2}$"
              example: '1000000.00'
            failureCode:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransferPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/Transfer"
        nextCursor:
          type: string
          nullable: true
    AuditEntry:
      type: object
      additionalProperties: false
      required:
      - eventId
      - transferId
      - sequence
      - type
      - actorId
      - occurredAt
      - receivedAt
      - correlationId
      - transferStatus
      - reversalId
      - reversalStatus
      properties:
        eventId:
          type: string
          format: uuid
        transferId:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        type:
          type: string
        actorId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        correlationId:
          type: string
        transferStatus:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - UNKNOWN
          - COMPLETED
          - FAILED
          - REVERSED
        reversalId:
          type: string
          format: uuid
          nullable: true
        reversalStatus:
          type: string
          enum:
          - PENDING
          - PROCESSING
          - UNKNOWN
          - COMPLETED
          - FAILED
          -
          nullable: true
    AuditPage:
      type: object
      additionalProperties: false
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/AuditEntry"
        nextCursor:
          type: string
          nullable: true
    BrowserSession:
      type: object
      additionalProperties: false
      required:
      - user
      - expiresIn
      properties:
        user:
          "$ref": "#/components/schemas/User"
        expiresIn:
          type: integer
          enum:
          - 900
